<style>
  :root {
    --navy:#0B1D35;
    --navy-2:#13294B;
    --red:#E8312A;
    --cream:#F7F3EE;
    --ink:#1A1A1A;
    --gold:#B8893A;
    --mist:#E5E0D6;
    --sage:#4A6B5C;
    --sage-tint:#E8EFEA;
    --ember:#C44536;
    --ember-tint:#F6E5E2;
    --paper:#FDFBF7;
    --graphite:#3A4754;
    --muted:#6B7785;
    --field:#FFFFFF;
    --bg-sage-soft:#F3F0E7;
    --bg-input-tint:#FBF9F2;
    --shadow: 0 4px 12px rgba(11,29,53,0.08);
    --overlay: rgba(11,29,53,0.35);
  }
  html.dark {
    --navy:#7AA4DD;
    --navy-2:#A8C2E5;
    --red:#FF6B66;
    --cream:#0A1219;
    --ink:#ECEEF1;
    --gold:#D9A85A;
    --mist:#22303F;
    --sage:#7DB39B;
    --sage-tint:#1B2A24;
    --ember:#E97064;
    --ember-tint:#2C1A18;
    --paper:#121C26;
    --graphite:#B6BFC9;
    --muted:#7A8896;
    --field:#1A2632;
    --bg-sage-soft:#172420;
    --bg-input-tint:#18222C;
    --shadow: 0 4px 12px rgba(0,0,0,0.45);
    --overlay: rgba(0,0,0,0.55);
  }
  html.dark .hm-good { background:#1F3329; }
  html.dark .hm-okay { background:#3A3320; }
  html.dark .hm-poor { background:#3B1F1D; }
  html.dark .hm-neut { background:#1F2832; }
  html.dark .dot-grid { background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); }
  html.dark input, html.dark select, html.dark textarea { background: var(--field); color: var(--ink); }
  html.dark .bg-white { background-color: var(--field) !important; }
  html.dark img { opacity: 0.92; }
  html, body, #root { background: var(--cream); color: var(--ink); }
  body { font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","cv11"; min-width: 1080px; }
  /* allow narrow viewports to scroll horizontally rather than break the dashboard layout */
  .font-serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "zero","ss01"; }
  .font-bn { font-family: 'Hind Siliguri', system-ui, sans-serif; }
  .smallcaps { text-transform: uppercase; letter-spacing: 0.2em; font-size: 11px; font-weight: 600; }
  .hair { border-color: var(--mist); }
  .hair-b { border-bottom: 1px solid var(--mist); }
  .hair-t { border-top: 1px solid var(--mist); }
  .hair-r { border-right: 1px solid var(--mist); }
  .hair-l { border-left: 1px solid var(--mist); }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 4px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  /* dotted grid for routine builder etc. */
  .dot-grid { background-image: radial-gradient(rgba(11,29,53,0.08) 1px, transparent 1px); background-size: 14px 14px; }
  /* subtle status edge */
  .edge-red { box-shadow: inset 3px 0 0 var(--red); }
  .edge-sage { box-shadow: inset 3px 0 0 var(--sage); }
  .edge-gold { box-shadow: inset 3px 0 0 var(--gold); }
  .edge-graphite { box-shadow: inset 3px 0 0 var(--graphite); }
  .edge-mist { box-shadow: inset 3px 0 0 var(--mist); }
  .edge-ember { box-shadow: inset 3px 0 0 var(--ember); }
  /* slide-over animation */
  @keyframes slideOver { from { transform: translateX(24px); opacity: 0;} to { transform: translateX(0); opacity: 1;} }
  .slide-in { animation: slideOver 200ms ease-out; }
  @keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }
  .fade-in { animation: fadeIn 200ms ease-out; }
  /* heatmap cell */
  .hm-good { background: #D6E4DC; }
  .hm-okay { background: #ECE4D2; }
  .hm-poor { background: #F1D9D8; }
  .hm-neut { background: #EEEBE2; }
  /* nav active */
  .nav-active-uni { background: var(--sage-tint); color: var(--sage); }
  .nav-active-sup { background: rgba(196,69,54,0.08); color: var(--ember); }
  /* focus ring */
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  /* pulse dot */
  @keyframes pulseDot { 0%,100%{ opacity: 1; transform: scale(1);} 50%{ opacity: 0.5; transform: scale(1.2);} }
  .pulse-dot { animation: pulseDot 1.4s ease-in-out infinite; }
  /* timetable cell */
  .tt-cell { transition: transform 120ms ease, box-shadow 120ms ease; }
  .tt-cell:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(11,29,53,0.08); }

  /* ─────────────────────────────────────────────────────────
   * TWEAK DIMENSION 1 · PALETTE  (data-palette: civic | court | field | ops)
   * Reshapes the entire accent story — primary/critical/trust/secondary.
   * ───────────────────────────────────────────────────────── */
  /* civic = default; nothing to override */
  html[data-palette="court"] {
    --navy:#091327; --navy-2:#15243F; --sage:#5E6D62; --sage-tint:#EAEAE3;
    --ember:#A0322B; --ember-tint:#F3E2DE; --gold:#9C7430;

    --ember:#B25543; --ember-tint:#F1E0DA; --gold:#9C8043;
    --cream:#F1EEE4; --paper:#FBF8EE; --mist:#D6CFB6; --graphite:#33402D;
    --muted:#6B7458; --red:#C44A36;
  }
  html[data-palette="ops"] {
    --navy:#162538; --navy-2:#243A56; --sage:#3F6F84; --sage-tint:#E1ECF0;
    --ember:#C25E26; --ember-tint:#F5E5D8; --gold:#5E7080;
    --cream:#EEF1F4; --paper:#FFFFFF; --mist:#D5DCE3; --graphite:#1E2A3A;
    --muted:#6A7785; --red:#D14424;
    --shadow: 0 6px 20px rgba(11,29,53,0.06);

  html[data-palette="ops"] .bg-\[var\(--paper\)\].hair.border { box-shadow: 0 1px 0 rgba(11,29,53,0.04); }

  /* dark-mode overrides per palette */
  html.dark[data-palette="court"] {
    --navy:#9DBCEC; --sage:#A6B5A9; --ember:#EC8278; --gold:#E2BB76;
    --cream:#0E1018; --paper:#181A22; --mist:#2C2E36;
  }
  html.dark[data-palette="field"] {
    --navy:#A4C9B7; --sage:#9CC09A; --ember:#EC9583; --gold:#D7B782;
    --cream:#0C1612; --paper:#18221E; --mist:#27322B;
  }
  html.dark[data-palette="ops"] {
    --navy:#7FB1D6; --sage:#7AAEC2; --ember:#F2935E; --gold:#9CAEC0;
    --cream:#0B1119; --paper:#141B26; --mist:#222C39;
  }

  /* ─────────────────────────────────────────────────────────
   * TWEAK DIMENSION 2 · VOICE  (data-voice: serif | sans | mono)
   * Reshapes the typographic register of every heading + section label.
   * ───────────────────────────────────────────────────────── */
  /* serif = default (Fraunces) */
  html[data-voice="sans"] .font-serif {
    font-family: 'Inter Tight', system-ui, sans-serif !important;
    font-weight: 600 !important;
    letter-spacing: -0.02em !important;
  }
  html[data-voice="sans"] h1, html[data-voice="sans"] h2, html[data-voice="sans"] h3 {
    font-feature-settings: "ss01","cv11";
  }
  html[data-voice="mono"] .font-serif {
    font-family: 'JetBrains Mono', ui-monospace, monospace !important;
    font-weight: 500 !important;
    letter-spacing: -0.04em !important;
  }
  html[data-voice="mono"] .smallcaps {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.12em;
  }
  html[data-voice="mono"] body {
    font-feature-settings: "zero","ss01","cv11";
  }
  /* serif voice using Newsreader as an alt for variety (kept as Fraunces) */
  html[data-voice="serif"] .font-serif {
    font-family: 'Fraunces', Georgia, serif !important;
  }

  /* ─────────────────────────────────────────────────────────
   * TWEAK DIMENSION 3 · SURFACE  (data-surface: paper | slate | canvas)
   * Reshapes spatial feel — borders, shadows, density of whitespace.
   * ───────────────────────────────────────────────────────── */
  /* paper = default (warm cream, hairlines, no shadows) */

  html[data-surface="slate"] {
    --cream:#EEF1F5; --paper:#FFFFFF; --mist:#D7DDE5; --graphite:#2A3645;
    --bg-input-tint:#F4F6F9;
  }
  html[data-surface="slate"] .bg-\[var\(--paper\)\].hair.border {
    box-shadow: 0 1px 2px rgba(15, 26, 45, 0.04), 0 6px 18px rgba(15, 26, 45, 0.04);
    border-color: rgba(15, 26, 45, 0.06);
  }
  html[data-surface="slate"] .hair, html[data-surface="slate"] .hair-b,
  html[data-surface="slate"] .hair-t, html[data-surface="slate"] .hair-l,
  html[data-surface="slate"] .hair-r { border-color: rgba(15, 26, 45, 0.08) !important; }
  html.dark[data-surface="slate"] {
    --cream:#0B121C; --paper:#161E2A; --mist:#2A3445;
  }

  html[data-surface="canvas"] {
    --cream:#EFEADD; --paper:#FAF5E8; --mist:#C9BFA8; --graphite:#2E2A20;
    --muted:#76705E;
  }
  html[data-surface="canvas"] body { line-height: 1.55; }
  html[data-surface="canvas"] .smallcaps { letter-spacing: 0.32em; }
  html[data-surface="canvas"] .bg-\[var\(--paper\)\].hair.border {
    border-width: 1.5px;
    border-color: rgba(46, 42, 32, 0.18);
  }
  html[data-surface="canvas"] .hair, html[data-surface="canvas"] .hair-b,
  html[data-surface="canvas"] .hair-t, html[data-surface="canvas"] .hair-l,
  html[data-surface="canvas"] .hair-r { border-color: rgba(46, 42, 32, 0.16) !important; }
  /* heavier section labels, more whitespace */
  html[data-surface="canvas"] .smallcaps { font-weight: 700; }
  html.dark[data-surface="canvas"] {
    --cream:#0F0E0B; --paper:#1A1812; --mist:#2E2A21; --graphite:#D5CEBA;
  }
</style>

<script type="text/babel">
// Shared UI primitives for Anchor Admin
var { useState, useEffect, useMemo, useRef, useCallback } = React;

// Dark mode hook — persists to localStorage and toggles class on <html>
function useDark() {
  const [dark, setDark] = useState(() => {
    try {
      const stored = localStorage.getItem('anchor:dark');
      if (stored !== null) return stored === '1';
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) { return false; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('anchor:dark', dark ? '1' : '0'); } catch (e) {}
  }, [dark]);
  return [dark, setDark];
}

// Lucide icon wrapper. We use a single component that emits an <i data-lucide=...> and re-renders on mount.
function Icon({ name, size = 16, className = '', strokeWidth = 1.75, style }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const i = document.createElement('i');
      i.setAttribute('data-lucide', name);
      ref.current.appendChild(i);
      window.lucide.createIcons({ attrs: { width: size, height: size, 'stroke-width': strokeWidth } });
    }
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size, ...style }} aria-hidden="true" />;
}

// Status pill
const STATUS_STYLES = {
  'Submitted':    { bg: '#EEEBE2', fg: '#3A4754', dot: '#6B7785' },
  'Under Review': { bg: '#F2E8D2', fg: '#7E5A19', dot: '#B8893A' },
  'Escalated':    { bg: '#F6E5E2', fg: '#A2362B', dot: '#E8312A' },
  'Resolved':     { bg: '#DDE8E1', fg: '#345249', dot: '#4A6B5C' },
  'Rejected':     { bg: '#E6E3DA', fg: '#52555C', dot: '#6B7785' },
  'Active':       { bg: '#F6E5E2', fg: '#A2362B', dot: '#E8312A' },
  'False Alarm':  { bg: '#EEEBE2', fg: '#3A4754', dot: '#6B7785' },
  'Pilot':        { bg: '#F2E8D2', fg: '#7E5A19', dot: '#B8893A' },
  'Suspended':    { bg: '#E6E3DA', fg: '#52555C', dot: '#6B7785' },
  'healthy':      { bg: '#DDE8E1', fg: '#345249', dot: '#4A6B5C' },
  'degraded':     { bg: '#F2E8D2', fg: '#7E5A19', dot: '#B8893A' },
  'down':         { bg: '#F6E5E2', fg: '#A2362B', dot: '#E8312A' },
  'Pending review':{ bg: '#F2E8D2', fg: '#7E5A19', dot: '#B8893A' },
  'Awaiting 2nd approval':{ bg: '#F6E5E2', fg: '#A2362B', dot: '#E8312A' },
  'Approved':      { bg: '#DDE8E1', fg: '#345249', dot: '#4A6B5C' },
  'Denied':        { bg: '#E6E3DA', fg: '#52555C', dot: '#6B7785' },
  'Expired':       { bg: '#E6E3DA', fg: '#52555C', dot: '#6B7785' },
  'User Safe':     { bg: '#DDE8E1', fg: '#345249', dot: '#4A6B5C' },
  'Closed':        { bg: '#E6E3DA', fg: '#52555C', dot: '#6B7785' },
};
function StatusPill({ status, dot=true, className='' }) {
  const s = STATUS_STYLES[status] || STATUS_STYLES['Submitted'];
  return (
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium tracking-wide ${className}`}
      style={{ background: s.bg, color: s.fg }}>
      {dot && <span className="w-1.5 h-1.5 rounded-full" style={{ background: s.dot }} />}
      <span className="whitespace-nowrap">{status}</span>
    </span>
  );
}

function StatusEdgeClass(status) {
  return {
    'Submitted':'edge-graphite','Under Review':'edge-gold','Escalated':'edge-red',
    'Resolved':'edge-sage','Rejected':'edge-mist','Active':'edge-red','False Alarm':'edge-mist',
  }[status] || 'edge-mist';
}

function SeverityDots({ severity=1, className='' }) {
  // returns dots: 1=info, 2=moderate, 3=serious
  const color = severity === 3 ? '#E8312A' : severity === 2 ? '#B8893A' : '#6B7785';
  return (
    <span className={`inline-flex items-center gap-0.5 ${className}`} title={`Rank ${severity}`}>
      {[1,2,3].map(i => (
        <span key={i} className="w-1.5 h-1.5 rounded-full" style={{ background: i<=severity ? color : '#E5E0D6' }} />
      ))}
    </span>
  );
}

function AnonymityBadge({ className='' }) {
  return (
    <span className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded-sm smallcaps ${className}`}
      style={{ background:'#13294B', color:'#F7F3EE', fontSize:'9.5px', letterSpacing:'0.16em' }}>
      <Icon name="eye-off" size={10} />
      <span>Anonymous</span>
    </span>
  );
}

function KpiCard({ label, value, delta, deltaTone='neutral', subtle, mono=true, accent='sage' }) {
  const accentColor = accent === 'ember' ? 'var(--ember)' : accent === 'gold' ? 'var(--gold)' : accent === 'navy' ? 'var(--navy)' : 'var(--sage)';
  const deltaColors = { up:'#345249', down:'#A2362B', neutral:'#6B7785' };
  return (
    <div className="bg-[var(--paper)] hair border rounded-sm p-4 flex flex-col gap-2 relative">
      <div className="flex items-center justify-between">
        <span className="smallcaps text-[var(--muted)]">{label}</span>
        <span className="w-1 h-3" style={{ background: accentColor }} />
      </div>
      <div className={`${mono?'font-mono':''} text-[28px] leading-none text-[var(--ink)] tabular-nums`}>{value}</div>
      <div className="flex items-center gap-2 text-[12px]">
        {delta && (
          <span className="inline-flex items-center gap-1" style={{ color: deltaColors[deltaTone] }}>
            <Icon name={deltaTone==='up'?'arrow-up-right':deltaTone==='down'?'arrow-down-right':'minus'} size={12} />
            <span className="font-medium">{delta}</span>
          </span>
        )}
        {subtle && <span className="text-[var(--muted)]">{subtle}</span>}
      </div>
    </div>
  );
}

function SectionLabel({ children, right, className='' }) {
  return (
    <div className={`flex items-end justify-between gap-2 mb-3 ${className}`}>

// Generic data table
function DataTable({ columns, rows, onRowClick, dense=false, hoverable=true }) {

// Confirm modal that requires typing the action word
function ConfirmModal({ open, onClose, onConfirm, title, body, confirmWord='CONFIRM', tone='red', confirmLabel='Confirm' }) {
  const [val, setVal] = useState('');
  useEffect(() => { if (open) setVal(''); }, [open]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center fade-in" style={{ background:'rgba(11,29,53,0.35)' }} onClick={onClose}>

          <div>

        <div className="p-4 hair-t flex items-center justify-end gap-2">
          <GhostButton onClick={onClose}>Cancel</GhostButton>
          <PrimaryButton mode={tone==='red'?'red':'sage'} onClick={()=>{ if (val===confirmWord) { onConfirm(); onClose(); }}} icon="check">
            {confirmLabel}

        </div>
      </div>
    </div>
  );
}

// SlideOver panel (right-aligned)
function SlideOver({ open, onClose, children, width=520 }) {

// Vertical timeline stepper
function Timeline({ items }) {

// Small mono chip
function MonoChip({ children, className='', tone='mist' }) {

function Tag({ children, tone='mist', icon }) {

<script type="text/babel">
// Anchor AI Admin — API client
const AnchorAPI = (() => {
  const BASE = window.ANCHOR_API_URL || 'http://localhost:8000';
  const K = {
    access: 'anchor_admin_access_token',
    refresh: 'anchor_admin_refresh_token',
    user: 'anchor_admin_user',
  };

  function getAccessToken() { return localStorage.getItem(K.access); }
  function getRefreshToken() { return localStorage.getItem(K.refresh); }

  function setTokens(access, refresh) {
    localStorage.setItem(K.access, access);
    if (refresh) localStorage.setItem(K.refresh, refresh);
  }

  function getStoredUser() {
    try { return JSON.parse(localStorage.getItem(K.user) || 'null'); } catch { return null; }
  }

  function setStoredUser(user) {
    localStorage.setItem(K.user, JSON.stringify(user));
  }

  function clearAuth() {
    Object.values(K).forEach(k => localStorage.removeItem(k));
  }

  // Attempt a silent token refresh. Returns true on success, false if session is dead.
  let _refreshing = null; // deduplicate concurrent refresh attempts
  async function _tryRefresh() {
    if (_refreshing) return _refreshing;
    const rt = getRefreshToken();
    if (!rt) return false;
    _refreshing = (async () => {
      try {
        const res = await fetch(BASE + '/auth/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: rt }),
        });
        if (!res.ok) { clearAuth(); return false; }
        const data = await res.json();
        setTokens(data.access_token, data.refresh_token);
        return true;
      } catch {
        return false;
      } finally {
        _refreshing = null;
      }
    })();
    return _refreshing;
  }

  // Coerce a FastAPI error body into a readable string (422 detail is an array of objects).
  function _detailMsg(data) {
    const d = data && data.detail;
    if (!d) return 'Request failed';
    if (typeof d === 'string') return d;
    if (Array.isArray(d)) return d.map(e => (e && e.msg) ? e.msg : JSON.stringify(e)).join('; ');
    if (typeof d === 'object') return d.msg || JSON.stringify(d);
    return String(d);
  }

  function _authHeaders(extra = {}) {
    const tok = getAccessToken();
    const headers = { ...extra };
    if (tok) headers['Authorization'] = 'Bearer ' + tok;
    return headers;
  }

  // Shared fetch-with-auto-refresh logic
  async function _fetch(buildReq, retried = false) {
    const [url, init] = buildReq();
    const res = await fetch(url, init);
    if (res.status === 401 && !retried) {
      const ok = await _tryRefresh();
      if (ok) return _fetch(buildReq, true);
      clearAuth();
      throw new Error('Session expired — please log in again');
    }
    const data = await res.json();
    if (!res.ok) throw new Error(_detailMsg(data));
    return data;
  }

  async function apiPost(path, body) {
    const res = await fetch(BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(_detailMsg(data));
    return data;
  }

  async function apiGet(path) {
    return _fetch(() => [BASE + path, { headers: _authHeaders() }]);
  }

  async function apiPostAuth(path, body) {
    return _fetch(() => [BASE + path, {
      method: 'POST',
      headers: _authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    }]);
  }

  async function apiPatch(path, body) {
    return _fetch(() => [BASE + path, {
      method: 'PATCH',
      headers: _authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body),
    }]);
  }

  async function apiDelete(path) {
    return _fetch(() => [BASE + path, {
      method: 'DELETE',
      headers: _authHeaders(),
    }]);
  }

  // Authenticated file download (e.g. CSV export). Streams the response to a
  // Blob and triggers a browser download. Retries once on 401 like _fetch.
  async function apiDownload(path, filename, retried = false) {
    const res = await fetch(BASE + path, { headers: _authHeaders() });
    if (res.status === 401 && !retried) {
      const ok = await _tryRefresh();
      if (ok) return apiDownload(path, filename, true);
      clearAuth();
      throw new Error('Session expired — please log in again');
    }
    if (!res.ok) {
      let msg = 'Download failed';
      try { msg = _detailMsg(await res.json()); } catch { /* non-JSON error body */ }
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'download';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  return { getAccessToken, getRefreshToken, setTokens, getStoredUser, setStoredUser, clearAuth, apiPost, apiGet, apiPostAuth, apiPatch, apiDelete, apiDownload };
})();

Object.assign(window, { AnchorAPI });
</script>

function _cap(s) { return String(s || '').replace(/^\w/, c => c.toUpperCase()); }

// Average resolution seconds → "3.2d" / "5.4h" / "—".
function _fmtResolution(secs) {
  if (!secs || secs <= 0) return '—';
  const days = secs / 86400;
  if (days >= 1) return `${days.toFixed(1)}d`;
  return `${(secs / 3600).toFixed(1)}h`;
}

const _FILING_STATUS = {
  draft: 'Submitted', moderation_queue: 'Submitted', routed: 'Submitted',
  subject_notified: 'Under Review', subject_responded: 'Under Review', under_review: 'Under Review',
  resolved: 'Resolved', dismissed: 'Rejected', withdrawn: 'Closed', spam_rejected: 'Rejected',
};
function _filingStatus(state) { return _FILING_STATUS[state] || 'Submitted'; }

// Render a labelled horizontal bar breakdown from a {key: count} map.
function BreakdownBars({ data, color = 'var(--sage)', labelMap }) {
  const entries = Object.entries(data || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return <div className="text-[12px] text-[var(--muted)] py-2">No data yet.</div>;
  const max = Math.max(...entries.map(([, v]) => v));
  return (
    <div className="space-y-3">
      {entries.map(([k, v]) => (
        <div key={k}>
          <div className="flex items-center justify-between text-[12px] mb-1">
            <span className="text-[var(--ink)]">{labelMap ? (labelMap[k] || _cap(k.replace(/_/g, ' '))) : _cap(k.replace(/_/g, ' '))}</span>
            <span className="font-mono text-[var(--muted)]">{v}</span>

// Shared fetch of the admin filing stats + a small recent-filings list.
function useFilingData() {
  const [stats, setStats] = useState(null);
  const [filings, setFilings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  useEffect(() => {
    let alive = true;
    setLoading(true);
    Promise.all([
      AnchorAPI.apiGet('/v1/admin/filings/stats'),
      AnchorAPI.apiGet('/v1/admin/filings?page=1').catch(() => []),
    ])
      .then(([s, list]) => { if (!alive) return; setStats(s); setFilings(Array.isArray(list) ? list : (list.items || [])); })
      .catch(e => { if (alive) setError(e.message || 'Failed to load'); })
      .finally(() => { if (alive) setLoading(false); });
    return () => { alive = false; };
  }, []);
  return { stats, filings, loading, error };
}

}

      <div className="w-28 shrink-0">
        <div className="text-[13px] text-[var(--ink)]">{label}</div>
        <div className="font-mono text-[18px] text-[var(--navy)] leading-tight">{total}</div>
      </div>
      <div className="flex-1" style={{ height: 40 }}>
        <ResponsiveContainer>
          <AreaChart data={data} margin={{ top: 4, right: 0, left: 0, bottom: 0 }}>
            <defs>
              <linearGradient id={gid} x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor={color} stopOpacity={0.3} />
                <stop offset="100%" stopColor={color} stopOpacity={0.02} />
              </linearGradient>
            </defs>
            <Tooltip contentStyle={{ background: '#FDFBF7', border: '1px solid #E5E0D6', borderRadius: 2, fontSize: 12 }} labelFormatter={() => label} />
            <Area type="monotone" dataKey="v" stroke={color} strokeWidth={1.5} fill={`url(#${gid})`} />
          </AreaChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function UniAnalytics({ onGo }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const load = useCallback(() => {
    setLoading(true); setError('');
    AnchorAPI.apiGet('/v1/admin/analytics')
      .then(d => setData(d))
      .catch(e => setError(e.message || 'Failed to load'))
      .finally(() => setLoading(false));
  }, []);
  useEffect(() => { load(); }, [load]);

  const f = data?.filings || {}, a = data?.applications || {}, al = data?.alerts || {}, u = data?.users || {}, ct = data?.content || {}, series = data?.series || {};
  const stageData = Object.fromEntries(Object.entries(a.by_stage || {}));

  return (
    <>
      <PageHeader
        title="Insights"
        bn="বিশ্লেষণ"
        description="Aggregate, anonymized analytics for your university — complaints, applications, alerts, and 14-day activity trends."
        actions={<GhostButton size="sm" icon="refresh-cw" onClick={load}>Refresh</GhostButton>}
      />

      {loading ? (
        <div className="p-10 text-center text-[13px] text-[var(--muted)]">Loading…</div>
      ) : error ? (
        <AuditNote tone="red" icon="alert-triangle">
          <span>{error} </span>
          <button onClick={load} className="underline font-medium ml-1">Retry →</button>
        </AuditNote>
      ) : (
        <>
          <div className="grid grid-cols-5 gap-4 mb-4">
            <KpiCard label="Open complaints" value={f.open ?? 0} subtle="in the pipeline" />
            <KpiCard label="Resolution rate" value={(f.resolution_rate ?? 0) + '%'} subtle={`${f.resolved ?? 0} of ${f.total ?? 0}`} accent="sage" />
            <KpiCard label="Escalation rate" value={(f.escalation_rate ?? 0) + '%'} subtle={`${f.escalated ?? 0} escalated`} accent="gold" />
            <KpiCard label="Avg resolution" value={_fmtResolution(f.avg_resolution_secs)} subtle="submit → resolve" />
            <KpiCard label="Active alerts" value={al.active ?? 0} subtle={`${al.false_alarm_30d ?? 0} false · 30d`} accent="ember" />
          </div>

          <div className="grid gap-4 mb-4" style={{ gridTemplateColumns: '1fr 1fr' }}>
            <Card>
              <SectionLabel right={<MonoChip>14d</MonoChip>}>Activity trends</SectionLabel>
              <div className="space-y-3">
                <TrendRow label="Complaints" series={series.filings_14d} color="#0B1D35" />
                <TrendRow label="Applications" series={series.applications_14d} color="#4A6B5C" />
                <TrendRow label="Alerts" series={series.alerts_14d} color="#C44536" />
              </div>
            </Card>
            <Card>
              <SectionLabel>Complaints by category</SectionLabel>
              <BreakdownBars data={f.by_category} color="var(--sage)" />
            </Card>
          </div>

          <div className="grid grid-cols-3 gap-4 mb-4">
            <Card>
              <SectionLabel>Caseload by status</SectionLabel>
              <BreakdownBars data={f.by_state} color="var(--navy)" />
            </Card>
            <Card>
              <SectionLabel right={<MonoChip>{a.in_review ?? 0} in review</MonoChip>}>Application pipeline</SectionLabel>
              <BreakdownBars data={stageData} color="var(--gold)" labelMap={_APP_STAGE_LABELS} />
              <div className="mt-3 hair-t border-t pt-3 flex items-center justify-between text-[12px]">
                <span className="text-[var(--muted)]">Approval rate</span>
                <span className="font-mono text-[var(--ink)]">{(a.approval_rate ?? 0)}% <span className="text-[var(--muted)]">({a.approved ?? 0}/{a.decided ?? 0})</span></span>
              </div>
            </Card>
            <Card>
              <SectionLabel>Tenant overview</SectionLabel>
              <div className="space-y-3">
                <div className="flex items-center justify-between text-[12.5px]"><span className="text-[var(--muted)]">Users</span><span className="font-mono text-[var(--ink)]">{(u.total ?? 0).toLocaleString()}</span></div>
                <div className="flex items-center justify-between text-[12.5px]"><span className="text-[var(--muted)]">Notices</span><span className="font-mono text-[var(--ink)]">{(ct.notices ?? 0).toLocaleString()}</span></div>
                <div className="flex items-center justify-between text-[12.5px]"><span className="text-[var(--muted)]">Feed posts</span><span className="font-mono text-[var(--ink)]">{(ct.feed_posts ?? 0).toLocaleString()}</span></div>
                <div className="flex items-center justify-between text-[12.5px]"><span className="text-[var(--muted)]">Total complaints</span><span className="font-mono text-[var(--ink)]">{(f.total ?? 0).toLocaleString()}</span></div>
              </div>
            </Card>
          </div>

          <div className="text-[11px] text-[var(--muted)] font-mono">generated {data?.generated_at ? new Date(data.generated_at).toLocaleString() : '—'}</div>
        </>
      )}
    </>
  );
}

Object.assign(window, { UniDashboard, UniAnalytics });
</script>
<script type="text/babel">
// University Complaints — moderation queue + slide-in detail (live API)
var { useState, useEffect, useCallback, useRef, useMemo } = React;
const STATE_LABEL = {
  draft:'Draft', moderation_queue:'Under Review', routed:'Submitted',
  subject_notified:'Under Review', subject_responded:'Under Review',
  under_review:'Under Review', resolved:'Resolved', dismissed:'Rejected',
  withdrawn:'Withdrawn', spam_rejected:'Rejected',
};

function _filingToCard(f) {
  const tpl = f.template || {};
  return {
    _raw: f,
    id: f.filing_number || f.id.slice(0, 12),
    fullId: f.id,
    title: f.body
      ? f.body.split('\n')[0].slice(0, 80) || tpl.name || 'Untitled'
      : tpl.name || 'Untitled',
    body: f.body || '',
    category: tpl.name || f.category,
    templateKey: tpl.key || '',
    anonymous: tpl.anonymity_mode === 'anonymous',
    status: STATE_LABEL[f.state] || f.state,
    state: f.state,
    severity: Math.min(3, Math.max(1, (f.escalation_level || 0) + 1)),
    level: f.escalation_level || 0,
    routing: f.escalation_level >= 2 ? ['Dean', 'VC Office'] : f.escalation_level >= 1 ? ['Dept Head', 'Dean'] : ['Dept Head'],
    submitted: new Date(f.created_at).toLocaleString(),
    lastAction: new Date(f.updated_at).toLocaleDateString(),
    submittedBy: f.anonymous ? null : (f.subject_descriptor || null),
    dept: f.field_values?.department || '',
    batch: f.field_values?.batch || '',
    notes: f.field_values?.admin_note || '',
    evidence: [],
    timeline: [],
    patternHint: null,
    reviews: f.reviews || [],
    attachments: f.attachments || [],
  };
}

function UniComplaints({ onGo }) {
  const [filings, setFilings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState('');
  const [selected, setSelected] = useState(null);
  const [detailFiling, setDetailFiling] = useState(null);
  const [detailLoading, setDetailLoading] = useState(false);
  const [filters, setFilters] = useState({
    status: 'All',
    categories: new Set(),
    severity: new Set(),
    anonymous: 'All',
    level: new Set(),
  });
  const [confirm, setConfirm] = useState(null);
  const [actionErr, setActionErr] = useState('');
  const [actionBusy, setActionBusy] = useState(false);

  const STATUS_OPTIONS = ['All','Draft','Submitted','Under Review','Resolved','Rejected'];

  function loadFilings() {
    setLoading(true); setLoadErr('');
    AnchorAPI.apiGet('/v1/admin/filings?page=1&page_size=50')
      .then(data => { setFilings(Array.isArray(data) ? data.map(_filingToCard) : []); setLoading(false); })
      .catch(err => { setLoadErr(err.message || 'Could not load complaints.'); setLoading(false); });
  }

  useEffect(() => { loadFilings(); }, []);

  function openDetail(card) {
    setSelected(card);
    setDetailFiling(null);
    setDetailLoading(true);
    setActionErr('');
    AnchorAPI.apiGet(`/v1/admin/filings/${card.fullId}`)
      .then(f => { setDetailFiling(f); setDetailLoading(false); })
      .catch(() => { setDetailLoading(false); });
  }

  async function doAction(action) {
    if (!selected) return;
    setActionBusy(true); setActionErr('');
    try {
      await AnchorAPI.apiPostAuth(`/v1/admin/filings/${selected.fullId}/review`, { action });
      setSelected(null);
      loadFilings();
    } catch (err) {
      setActionErr(err.message || 'Action failed.');
    } finally { setActionBusy(false); }
  }

  const rows = useMemo(() => filings.filter(c => {
    if (filters.status !== 'All' && c.status !== filters.status) return false;
    if (filters.categories.size && !filters.categories.has(c.category)) return false;
    if (filters.severity.size && !filters.severity.has(c.severity)) return false;
    if (filters.anonymous === 'Yes' && !c.anonymous) return false;
    if (filters.anonymous === 'No' && c.anonymous) return false;
    if (filters.level.size && !filters.level.has(c.level)) return false;
    return true;
  }), [filings, filters]);

  const allCategories = useMemo(() => [...new Set(filings.map(f => f.category))], [filings]);

  const toggleSet = (key, val) => setFilters(f => {
    const s = new Set(f[key]);
    s.has(val) ? s.delete(val) : s.add(val);
    return { ...f, [key]: s };
  });

  return (
    <>
      <PageHeader
        title="Complaints"
        bn="অভিযোগসমূহ"
        description="Moderate the complaint queue. Select a case to open its detail, action it, or escalate. Every status change is audit-logged."
        actions={
          <>
            <GhostButton icon="refresh-cw" size="sm" onClick={loadFilings}>Refresh</GhostButton>
            <GhostButton icon="download" size="sm">Export</GhostButton>
          </>
        }
      />

      {loadErr && (
        <div className="mb-4 px-3 py-2 rounded-sm text-[12.5px]" style={{ background:'rgba(232,49,42,0.08)', color:'var(--red)', border:'1px solid rgba(232,49,42,0.2)' }}>
          {loadErr} — <button className="underline" onClick={loadFilings}>Retry</button>
        </div>
      )}

      <div className="grid gap-5" style={{ gridTemplateColumns: '240px 1fr' }}>
        {/* Filter rail */}
        <aside className="space-y-5">
          <FilterGroup label="Status">
            {STATUS_OPTIONS.map(s => (
              <label key={s} className="flex items-center gap-2 text-[13px] py-1 cursor-pointer">
                <input type="radio" checked={filters.status===s} onChange={()=>setFilters(f=>({...f, status:s}))} className="accent-[var(--sage)]" />
                <span className={filters.status===s?'text-[var(--ink)] font-medium':'text-[var(--graphite)]'}>{s}</span>
                <span className="ml-auto font-mono text-[10px] text-[var(--muted)]">
                  {s==='All' ? filings.length : filings.filter(c=>c.status===s).length}
                </span>
              </label>
            ))}
          </FilterGroup>

          {allCategories.length > 0 && (
            <FilterGroup label="Category">
              {allCategories.map(c => (
                <label key={c} className="flex items-center gap-2 text-[13px] py-1 cursor-pointer">
                  <input type="checkbox" checked={filters.categories.has(c)} onChange={()=>toggleSet('categories', c)} className="accent-[var(--sage)]" />
                  <span className="text-[var(--graphite)]">{c}</span>
                </label>
              ))}
            </FilterGroup>
          )}

          <FilterGroup label="Severity">
            {[1,2,3].map(s => (
              <label key={s} className="flex items-center gap-2 text-[13px] py-1 cursor-pointer">
                <input type="checkbox" checked={filters.severity.has(s)} onChange={()=>toggleSet('severity', s)} className="accent-[var(--sage)]" />
                <SeverityDots severity={s} />
                <span className="text-[var(--graphite)]">Rank {s}</span>
              </label>
            ))}
          </FilterGroup>

          <FilterGroup label="Anonymous">
            <div className="flex hair border rounded-sm overflow-hidden text-[12px]">
              {['All','Yes','No'].map(v => (
                <button key={v} onClick={()=>setFilters(f=>({...f, anonymous:v}))}
                  className={`flex-1 py-1.5 ${filters.anonymous===v?'bg-[var(--sage)] text-white':'text-[var(--graphite)] hover:bg-[var(--mist)]/40'}`}>
                  {v}
                </button>
              ))}
            </div>
          </FilterGroup>

          <button onClick={()=>setFilters({ status:'All', categories:new Set(), severity:new Set(), anonymous:'All', level:new Set() })}
            className="text-[12px] text-[var(--muted)] hover:text-[var(--ink)]">Clear all filters</button>
        </aside>

        {/* Result list */}
        <div>
          <div className="flex items-center justify-between mb-3">
            <div className="text-[13px] text-[var(--graphite)]">
              {loading
                ? <span className="text-[var(--muted)]">Loading…</span>
                : <><span className="font-mono text-[var(--ink)]">{rows.length}</span> cases · sorted by most recent action</>
              }
            </div>
          </div>

          {loading && (
            <div className="space-y-2.5">
              {[1,2,3].map(i => (
                <div key={i} className="bg-[var(--paper)] hair border rounded-sm p-4 animate-pulse">
                  <div className="h-4 bg-[var(--mist)] rounded-sm w-1/3 mb-2" />
                  <div className="h-3 bg-[var(--mist)] rounded-sm w-2/3" />
                </div>
              ))}
            </div>
          )}

          {!loading && (
            <div className="space-y-2.5">
              {rows.map(c => (
                <ComplaintCard key={c.fullId} c={c} onClick={()=>openDetail(c)} active={selected?.fullId===c.fullId} />
              ))}
              {rows.length===0 && (
                <Card><EmptyState icon="inbox" title="No matching complaints" body={loadErr ? 'Backend error — check server.' : 'No filings found. Try clearing the filters.'} /></Card>
              )}
            </div>
          )}
        </div>
      </div>

      {/* Slide-over */}
      <SlideOver open={!!selected} onClose={()=>setSelected(null)} width={620}>
        {selected && (
          <ComplaintDetail
            c={selected}
            detail={detailFiling}
            detailLoading={detailLoading}
            actionErr={actionErr}
            actionBusy={actionBusy}
            onClose={()=>setSelected(null)}
            onEscalate={()=>setConfirm('escalate')}
            onResolve={()=>setConfirm('resolve')}
            onMarkUnderReview={()=>doAction('mark_under_review')}
            onDismiss={()=>doAction('dismiss')}
          />
        )}
      </SlideOver>

      <ConfirmModal
        open={confirm==='escalate'} onClose={()=>setConfirm(null)} onConfirm={()=>{ setConfirm(null); doAction('escalate'); }}
        title="Escalate this complaint?"
        body="Escalation will route the case to the next authority level and notify the submitter."
        confirmWord="ESCALATE" confirmLabel="Escalate" tone="red"
      />
      <ConfirmModal
        open={confirm==='resolve'} onClose={()=>setConfirm(null)} onConfirm={()=>{ setConfirm(null); doAction('resolve'); }}
        title="Mark this complaint as resolved?"
        body="The submitter will be notified that the case is resolved. They can re-open it within 14 days."
        confirmWord="RESOLVE" confirmLabel="Resolve" tone="sage"
      />
    </>
  );
}

function FilterGroup({ label, children }) {
  return (
    <div>
      <div className="smallcaps text-[var(--muted)] mb-1.5">{label}</div>
      <div className="flex flex-col">{children}</div>
    </div>
  );
}

function ComplaintCard({ c, onClick, active }) {
  return (
    <button onClick={onClick}
      className={`w-full text-left bg-[var(--paper)] hair border rounded-sm p-4 hover:bg-[var(--mist)]/15 transition relative ${active?'shadow-md':''} ${StatusEdgeClass(c.status)}`}
      style={ active ? { boxShadow:'inset 3px 0 0 var(--sage), 0 0 0 1px var(--sage)' } : undefined }>
      <div className="flex items-start gap-3">
        <div className="w-9 h-9 rounded-sm flex items-center justify-center shrink-0" style={{ background:'var(--mist)' }}>
          <Icon name="file-text" size={16} style={{ color:'var(--graphite)' }} />
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex flex-wrap items-center gap-2 mb-1">
            <MonoChip>{c.id}</MonoChip>
            <span className="smallcaps text-[var(--muted)]">{c.category}</span>
            <SeverityDots severity={c.severity} />
            {c.anonymous && <AnonymityBadge />}
            <span className="ml-auto text-[11px] text-[var(--muted)] font-mono">{c.lastAction}</span>
          </div>
          <div className="text-[14px] text-[var(--ink)] font-medium leading-snug" style={{ textWrap:'pretty' }}>{c.title}</div>
          <div className="mt-2 flex items-center gap-3 text-[11.5px] text-[var(--muted)]">
            <span className="inline-flex items-center gap-1"><Icon name="user" size={12} /> {c.anonymous ? '— anonymous —' : (c.submittedBy || 'student')}</span>
            <span>·</span>
            <span className="inline-flex items-center gap-1"><Icon name="route" size={12} /> {c.routing.join(' → ')}</span>
            <span>·</span>
            <span className="inline-flex items-center gap-1"><Icon name="clock" size={12} /> {c.submitted.split(',')[0]}</span>
          </div>
        </div>
        <StatusPill status={c.status} />
      </div>
    </button>
  );
}

function ComplaintDetail({ c, detail, detailLoading, actionErr, actionBusy, onClose, onEscalate, onResolve, onMarkUnderReview, onDismiss }) {
  const [tab, setTab] = useState('overview');

  const reviews = detail?.reviews || [];
  const attachments = detail?.attachments || [];

  return (
    <div className="flex flex-col h-full">
      {/* Header */}
      <div className="hair-b p-5 sticky top-0 bg-[var(--paper)] z-10">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="flex flex-wrap items-center gap-2 mb-2">
              <MonoChip tone="navy">{c.id}</MonoChip>
              <StatusPill status={c.status} />
              <SeverityDots severity={c.severity} />
              {c.anonymous && <AnonymityBadge />}
            </div>
            <h2 className="font-serif text-[22px] leading-tight text-[var(--navy)]" style={{fontWeight:500, textWrap:'pretty'}}>{c.title}</h2>
            <div className="mt-1.5 text-[12px] text-[var(--muted)]">
              {c.anonymous ? '— anonymous submitter —' : (c.submittedBy || 'student')}
              {c.dept ? ` · ${c.dept}` : ''}
              {c.batch ? ` · ${c.batch}` : ''}
              {' · submitted '}<span className="font-mono">{c.submitted}</span>
            </div>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-sm hover:bg-[var(--mist)]/40 flex items-center justify-center">
            <Icon name="x" size={16} />
          </button>
        </div>
        {/* Tabs */}
        <div className="mt-4 flex items-center gap-1 -mx-1">
          {['overview','timeline','evidence','routing','notes'].map(t => (
            <button key={t} onClick={()=>setTab(t)} className={`px-3 py-1.5 text-[12.5px] rounded-sm ${tab===t?'bg-[var(--sage-tint)] text-[var(--sage)] font-medium':'text-[var(--muted)] hover:bg-[var(--mist)]/40'}`}>
              {{overview:'Overview', timeline:'Timeline', evidence:'Evidence', routing:'Routing', notes:'Reviews'}[t]}
            </button>
          ))}
        </div>
      </div>

      {/* Tab content */}
      <div className="p-5 flex-1 space-y-5 overflow-y-auto">
        {detailLoading && (
          <div className="space-y-3 animate-pulse">
            <div className="h-4 bg-[var(--mist)] rounded-sm w-full" />
            <div className="h-4 bg-[var(--mist)] rounded-sm w-4/5" />
            <div className="h-4 bg-[var(--mist)] rounded-sm w-3/5" />
          </div>
        )}

        {!detailLoading && tab==='overview' && (
          <>
            {c.anonymous && (
              <AuditNote tone="red" icon="shield-alert">
                This case has Rank-{c.severity} anonymity protection. Identity is not visible without formal de-anonymization through Super Admin.
              </AuditNote>
            )}
            <section>
              <SectionLabel>Complaint body</SectionLabel>
              <p className="text-[13.5px] text-[var(--ink)] leading-relaxed" style={{ textWrap:'pretty' }}>
                {(detail?.body || c.body) || <span className="text-[var(--muted)] italic">No body text — submitter left blank or draft.</span>}
              </p>
            </section>
            {attachments.length > 0 && (
              <section>
                <SectionLabel>Evidence</SectionLabel>
                <div className="flex gap-2 flex-wrap">
                  {attachments.map(e => (
                    <div key={e.id} className="hair border rounded-sm p-2 flex items-center gap-2 text-[12px]">
                      <div className="w-8 h-8 rounded-sm flex items-center justify-center" style={{ background:'#EEEBE2' }}>
                        <Icon name={e.content_type?.includes('pdf')?'file-text':'image'} size={14} />
                      </div>
                      <span className="font-mono text-[11px] text-[var(--graphite)]">{e.original_filename}</span>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </>
        )}

        {!detailLoading && tab==='timeline' && (
          <div>
            <SectionLabel>Case timeline</SectionLabel>
            {reviews.length === 0 && <EmptyState icon="clock" title="No actions yet" body="No admin review actions have been taken on this filing." />}
            <ol className="relative pl-6 space-y-4">
              <span className="absolute left-[9px] top-2 bottom-2 w-px bg-[var(--mist)]" />
              {reviews.map((r, i) => (
                <li key={r.id || i} className="relative">
                  <span className="absolute -left-[24px] top-0 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-mono"
                    style={{ background:'var(--sage)', color:'white' }}>{i+1}</span>
                  <div className="text-[13px] text-[var(--ink)] font-medium">{r.action}</div>
                  <div className="text-[11px] text-[var(--muted)] font-mono">{r.reviewer_role} · {new Date(r.reviewed_at).toLocaleString()}</div>
                  {r.public_note && <div className="text-[12.5px] text-[var(--graphite)] mt-1">{r.public_note}</div>}
                </li>
              ))}
            </ol>
          </div>
        )}

        {!detailLoading && tab==='evidence' && (
          <div>
            <SectionLabel>All evidence ({attachments.length})</SectionLabel>
            {attachments.length>0 ? (
              <div className="grid grid-cols-2 gap-3">
                {attachments.map(e => (
                  <div key={e.id} className="hair border rounded-sm p-3">
                    <div className="aspect-video rounded-sm mb-2 dot-grid" style={{ background:'#EEEBE2' }} />
                    <div className="font-mono text-[11px] text-[var(--graphite)]">{e.original_filename}</div>
                    <div className="text-[10px] text-[var(--muted)]">{e.content_type}</div>
                  </div>
                ))}
              </div>
            ) : <EmptyState icon="image-off" title="No evidence attached" body="Submitter did not attach photos, documents, or audio." />}
          </div>
        )}

        {!detailLoading && tab==='routing' && (
          <div>
            <SectionLabel>Routing chain</SectionLabel>
            <ol className="relative pl-6">
              <span className="absolute left-[9px] top-2 bottom-2 w-px bg-[var(--mist)]" />
              {['Submitted by student', 'Dept Head', ...(c.level>=1?['Dean']:[]), ...(c.level>=2?['VC Office']:[])].map((step, i) => {
                const reached = i <= c.routing.length;
                return (
                  <li key={i} className="relative pb-5 last:pb-0">
                    <span className="absolute -left-[24px] top-0 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-mono"
                      style={{ background: reached ? 'var(--sage)' : 'var(--mist)', color: reached ? 'white' : 'var(--muted)' }}>{i+1}</span>
                    <div className="text-[13px] text-[var(--ink)] font-medium">{step}</div>
                  </li>
                );
              })}
            </ol>
            <AuditNote tone="navy" icon="route" className="mt-3">
              Escalation level: <span className="font-mono">{c.level}</span>
            </AuditNote>
          </div>
        )}

        {!detailLoading && tab==='notes' && (
          <div>
            <SectionLabel>Admin review history</SectionLabel>
            {reviews.length === 0
              ? <EmptyState icon="clipboard" title="No reviews yet" body="No admin review actions recorded." />
              : (
                <div className="hair border rounded-sm divide-y" style={{ borderColor:'var(--mist)' }}>
                  {reviews.map((r, i) => (
                    <div key={r.id || i} className="p-3">

                        <MonoChip>{r.action}</MonoChip>
                        <span className="text-[11px] text-[var(--muted)]">{r.reviewer_role}</span>
                        <span className="ml-auto text-[10px] text-[var(--muted)] font-mono">{new Date(r.reviewed_at).toLocaleString()}</span>
                      </div>
                      {r.public_note && <p className="text-[12.5px] text-[var(--ink)]">{r.public_note}</p>}
                      {r.internal_note && <p className="text-[11.5px] text-[var(--muted)] mt-0.5 italic">{r.internal_note}</p>}
                    </div>
                  ))}
                </div>
              )
            }
          </div>
        )}
      </div>

      {/* Action bar */}
      {actionErr && (
        <div className="px-4 py-2 text-[12px]" style={{ background:'rgba(232,49,42,0.08)', color:'var(--red)' }}>{actionErr}</div>
      )}
      <div className="hair-t border-t p-4 sticky bottom-0 bg-[var(--paper)] flex flex-wrap items-center gap-2">
        <GhostButton size="sm" icon="eye" disabled={actionBusy} onClick={onMarkUnderReview}>Mark Under Review</GhostButton>
        <PrimaryButton size="sm" icon="check" mode="sage" disabled={actionBusy} onClick={onResolve}>Resolve</PrimaryButton>
        <PrimaryButton size="sm" icon="arrow-up-right" mode="red" disabled={actionBusy} onClick={onEscalate}>Escalate</PrimaryButton>
        <GhostButton size="sm" icon="x" danger disabled={actionBusy} onClick={onDismiss}>Reject</GhostButton>
      </div>
    </div>
  );
}

Object.assign(window, { UniComplaints });
</script>

                <option value="EEE">Department of EEE</option>
              </select>
              <span className="smallcaps text-[var(--muted)] ml-3">Semester</span>
              <select value={semester} onChange={e=>setSemester(e.target.value)} className="hair border rounded-sm bg-white px-2 py-1">
                <option>Spring 2026</option>
                <option>Summer 2026</option>
              </select>
            </div>
            <StatusPill status={step===2 && solved ? 'Submitted' : 'Submitted'} />
            <MonoChip tone="navy">Draft</MonoChip>
          </>
        }
      />

      {/* Stepper */}
      <Card noPad className="mb-6">
        <div className="grid grid-cols-3">
          {[
            { i:0, name:'Input data', sub:'Courses, teachers, rooms, constraints', icon:'database' },
            { i:1, name:'Generate schedule', sub:'OR-Tools CP-SAT solver', icon:'cpu' },
            { i:2, name:'Review & publish', sub:'Weekly grid, conflicts, notify', icon:'calendar-check' },
          ].map((s, idx) => {
            const done = idx < step;
            const active = idx === step;
            return (
              <button key={s.i} onClick={()=>setStep(idx)} className={`p-5 text-left flex items-center gap-3 hair-r last:border-r-0 transition ${active?'bg-[var(--sage-tint)]/60':'hover:bg-[var(--mist)]/30'}`}>

                  <div className={`text-[13.5px] font-medium ${active?'text-[var(--sage)]':'text-[var(--ink)]'}`}>{s.name}</div>

      {step===0 && <RoutineInput tab={tab} setTab={setTab} D={D} />}
      {step===1 && <RoutineGenerate solving={solving} solved={solved} onSolve={() => { setSolving(true); setTimeout(()=>{ setSolving(false); setSolved(true); setStep(2); }, 1800); }} />}
      {step===2 && <RoutineReview D={D} dept={dept} semester={semester} onPublish={()=>setPublishConfirm(true)} />}

}

    setPublishing(true); setPublishError('');

      const slots = D.timetable.map(t => ({ day: D.days[t.d], time: D.slots[t.s], course: t.code, room: t.room, teacher: t.teacher, section: t.sec }));

            Routine published and students notified.

        ) : (
          <PrimaryButton mode="sage" icon="send" className="justify-center" disabled={publishing} onClick={handlePublishToAPI}>
            {publishing ? 'Publishing…' : 'Publish routine'}

        )}

            <SectionLabel>Published routines</SectionLabel>

            </div>
            <div className="p-3 hair-t flex items-center justify-end gap-2">
              <GhostButton onClick={()=>setEditing(null)}>Cancel</GhostButton>
              <PrimaryButton icon="check" mode="sage" onClick={()=>setEditing(null)}>Apply</PrimaryButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Row({ k, v, tone }) {
  const c = tone==='sage' ? 'var(--sage)' : tone==='gold' ? 'var(--gold)' : 'var(--ink)';
  return (
    <div className="flex items-center justify-between hair-b last:border-b-0 py-1.5">
      <span className="text-[var(--muted)]">{k}</span>
      <span className="font-mono" style={{ color: c }}>{v}</span>
    </div>
  );
}

Object.assign(window, { UniRoutine });

<script type="text/babel">

const STATE_LABEL_MISC = {

function UniNotices({ onGo }) {

  const [generating, setGenerating] = useState(false);
  const [aiGenerated, setAiGenerated] = useState(null); // null=not yet, true=AI, false=fallback

  function parseAudience() {
    for (const a of audience) {

  async function handleGenerate() {
    if (!prompt.trim()) { setActionError('Describe the notice for the AI first.'); return; }
    setGenerating(true); setActionError(''); setActionSuccess('');
    try {
      const audienceLabel = Array.from(audience)[0] || 'University-wide';
      const data = await AnchorAPI.apiPostAuth('/v1/notices/generate', {

        tone,
        audience: audienceLabel,

      setActionError(err.message || 'Could not generate notice.');

  }

  async function handleSaveDraft() {
    if (!subject.trim() || !generated.trim()) { setActionError('Subject and body are required.'); return; }
    setSaving(true); setActionError(''); setActionSuccess('');
    try {
      const { scope, dept, batch } = parseAudience();

      setActionSuccess('Draft saved.');

      setActionError(err.message || 'Could not save draft.');

  async function handlePublish() {
    if (!subject.trim() || !generated.trim()) { setActionError('Subject and body are required.'); return; }
    setPublishing(true); setActionError(''); setActionSuccess('');
    try {
      const { scope, dept, batch } = parseAudience();
      const notice = await AnchorAPI.apiPostAuth('/v1/notices', { scope, dept: dept || null, batch: batch || null, title: subject.trim(), body: generated.trim() });
      await AnchorAPI.apiPostAuth(`/v1/notices/${notice.id}/publish`, {});

      setActionError(err.message || 'Could not publish notice.');

  return (
    <>
      <PageHeader

        description="Draft and publish notices in Bangla and English. The AI assists with tone and translation; distribution goes via push and SMS."
        actions={
          <>
            <GhostButton icon="archive" size="sm">Archive</GhostButton>
            <GhostButton icon="clock" size="sm">Drafts</GhostButton>

      />

      <div className="grid gap-6" style={{ gridTemplateColumns:'1fr 380px' }}>
        {/* Compose */}
        <div className="space-y-4">
          {actionError && <div className="mb-3 px-3 py-2 rounded-sm text-[12.5px]" style={{ background:'rgba(232,49,42,0.08)', color:'var(--red)', border:'1px solid rgba(232,49,42,0.2)' }}>{actionError}</div>}
          {actionSuccess && <div className="mb-3 px-3 py-2 rounded-sm text-[12.5px]" style={{ background:'rgba(74,107,92,0.08)', color:'var(--sage)', border:'1px solid rgba(74,107,92,0.2)' }}>{actionSuccess}</div>}
          <Card>
            <Field label="Subject">
              <input value={subject} onChange={e=>setSubject(e.target.value)}
                className="w-full px-3 py-2.5 hair border rounded-sm bg-white text-[14px]" />
            </Field>

            <div className="mt-4">
              <Field label="Prompt to AI" hint="Describe what the notice should communicate. The AI will draft it in the configured tone.">
                <textarea value={prompt} onChange={e=>setPrompt(e.target.value)}
                  className="w-full p-3 hair border rounded-sm bg-white text-[13px] min-h-[80px]" />
              </Field>
              <div className="mt-2 flex items-center gap-2">
                <PrimaryButton mode="sage" size="sm" icon="sparkles" onClick={handleGenerate} disabled={generating}>
                  {generating?'Generating…':'Generate notice'}
                </PrimaryButton>
                <span className="text-[11px] text-[var(--muted)]">
                  {aiGenerated === false
                    ? 'AI offline — template draft (edit before publishing)'
                    : 'Powered by Qwen3 (Ollama) · grounded in DIU notice conventions'}
                </span>
              </div>
            </div>
          </Card>

          <Card>
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1 hair border rounded-sm overflow-hidden">
                <button onClick={()=>setLanguage('en')} className={`px-3 py-1 text-[12px] ${language==='en'?'bg-[var(--sage)] text-white':'text-[var(--graphite)]'}`}>English</button>
                <button onClick={()=>setLanguage('bn')} className={`px-3 py-1 text-[12px] font-bn ${language==='bn'?'bg-[var(--sage)] text-white':'text-[var(--graphite)]'}`}>বাংলা</button>
              </div>
              <div className="flex items-center gap-1 text-[var(--muted)]">
                {['bold','italic','list','link','image'].map(i => (
                  <button key={i} className="w-7 h-7 rounded-sm hover:bg-[var(--mist)]/40 flex items-center justify-center"><Icon name={i==='bold'?'bold':i==='italic'?'italic':i==='list'?'list':i==='link'?'link':'image'} size={13} /></button>
                ))}
              </div>
            </div>
            <textarea value={generated}
              onChange={e=>setGenerated(e.target.value)}
              placeholder={language==='bn' ? 'বিজ্ঞপ্তির খসড়া এখানে তৈরি হবে…' : 'The generated notice draft will appear here…'}
              className={`w-full p-4 hair border rounded-sm bg-[#FDFBF7] text-[13.5px] leading-relaxed min-h-[280px] ${language==='bn'?'font-bn':''}`} />
          </Card>

          <Card>
            <SectionLabel>Audience scope</SectionLabel>
            <div className="flex flex-wrap gap-2 mb-4">
              {['University-wide','Department: SWE','Department: CSE','Batch 54','Batch 55','Section 54-A','Female Hall 2'].map(a => {
                const on = audience.has(a);
                return (
                  <button key={a} onClick={()=>setAudience(s=>{ const n=new Set(s); n.has(a)?n.delete(a):n.add(a); return n;})}
                    className={`px-2.5 py-1 rounded-sm text-[12px] hair border ${on?'bg-[var(--sage)] text-white border-transparent':'text-[var(--graphite)]'}`}>
                    {a}
                  </button>
                );
              })}
            </div>

            <SectionLabel>Distribution channels</SectionLabel>
            <div className="grid grid-cols-3 gap-2">
              {[
                { key:'push', icon:'bell', label:'Push' },
                { key:'sms', icon:'message-square', label:'SMS' },
                { key:'email', icon:'mail', label:'Email' },
              ].map(c => (
                <label key={c.key} className={`flex items-center gap-2 px-3 py-2 hair border rounded-sm cursor-pointer ${channels[c.key]?'bg-[var(--sage-tint)]/70 border-[var(--sage)]':''}`}>
                  <Icon name={c.icon} size={14} />
                  <span className="text-[13px]">{c.label}</span>
                  <input type="checkbox" checked={channels[c.key]} onChange={e=>setChannels(s=>({...s,[c.key]:e.target.checked}))} className="ml-auto accent-[var(--sage)]" />
                </label>
              ))}
            </div>

            <div className="mt-4 grid grid-cols-2 gap-3">
              <Field label="Schedule"><select value={schedule} onChange={e=>setSchedule(e.target.value)} className="w-full px-2 py-1.5 hair border rounded-sm bg-white text-[13px]"><option>Send now</option><option>Schedule for later</option></select></Field>
              <Field label="Tone"><select value={tone} onChange={e=>setTone(e.target.value)} className="w-full px-2 py-1.5 hair border rounded-sm bg-white text-[13px]"><option>Formal · institutional</option><option>Warm · student-friendly</option></select></Field>
            </div>
          </Card>

          <div className="flex items-center justify-end gap-2">
            <GhostButton icon="save" onClick={handleSaveDraft} disabled={saving}>{saving ? 'Saving…' : 'Save draft'}</GhostButton>
            <PrimaryButton icon="send" mode="sage" onClick={handlePublish} disabled={publishing}>{publishing ? 'Publishing…' : 'Publish'}</PrimaryButton>
          </div>
        </div>

        {/* Preview */}
        <div className="sticky top-20 self-start">
          <SectionLabel right={<MonoChip>preview</MonoChip>}>Student app preview</SectionLabel>
          <div className="mx-auto rounded-[28px] hair border p-2.5 shadow-lg" style={{ width: 280, background:'#0B1D35' }}>
            <div className="rounded-[20px] bg-[var(--cream)] overflow-hidden" style={{ height: 560 }}>
              <div className="px-5 pt-4 pb-3 hair-b flex items-center justify-between">

              <div className="px-4 py-3 hair-b flex items-center gap-2">

                <span className="ml-auto text-[10px] text-[var(--muted)] font-mono">just now</span>
              </div>

                  {subject || 'Notice subject'}
                </h4>
                <div className="mt-1 text-[11px] text-[var(--muted)]">Registrar's Office · DIU</div>
                <p className={`mt-3 text-[12px] text-[var(--ink)] leading-relaxed ${language==='bn'?'font-bn':''}`} style={{ textWrap:'pretty' }}>

                </p>

          </div>
          <div className="mt-4 hair border rounded-sm p-3 text-[12px] text-[var(--graphite)]">

// ---- Campus Geofence (university side — alert console moved to Super Admin) ----
function UniGeofence({ onGo }) {
  const [vertices, setVertices] = useState([]);
  const [zones, setZones] = useState([]);
  const [selectedZone, setSelectedZone] = useState(null);
  const [zoneName, setZoneName] = useState('');
  const [zoneDesc, setZoneDesc] = useState('');
  const [drawMode, setDrawMode] = useState(false);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [recentAlerts, setRecentAlerts] = useState([]);
  const [mapError, setMapError] = useState(null);

  const mapDivRef = useRef(null);
  const leafletMapRef = useRef(null);
  const polygonRef = useRef(null);
  const markersRef = useRef([]);
  const savedLayersRef = useRef([]);
  const drawModeRef = useRef(false);

  const loadZones = () => {
    AnchorAPI.apiGet('/v1/admin/campus-zones')
      .then(r => { setZones(Array.isArray(r) ? r : []); setLoadError(null); })
      .catch(e => setLoadError(e.message || 'Failed to load zones'));
  };

  useEffect(() => {
    loadZones();
    AnchorAPI.apiGet('/v1/admin/alerts?state=active&limit=5')
      .then(r => setRecentAlerts(r.items ?? []))
      .catch(() => {});
  }, []);

  useEffect(() => { drawModeRef.current = drawMode; }, [drawMode]);

  // Init Leaflet map once
  useEffect(() => {
    if (!mapDivRef.current || leafletMapRef.current) return;
    if (!window.L) { setMapError('Map library failed to load. Please refresh the page.'); return; }
    try {
      const map = window.L.map(mapDivRef.current, { zoomControl: true }).setView([23.7450, 90.3718], 15);
      window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);
      leafletMapRef.current = map;
      setTimeout(() => map.invalidateSize(), 100);
      map.on('click', (e) => {
        if (!drawModeRef.current) return;
        const { lat, lng } = e.latlng;
        setVertices(v => [...v, [parseFloat(lat.toFixed(6)), parseFloat(lng.toFixed(6))]]);
      });
    } catch (err) {
      setMapError('Map failed to initialise: ' + (err.message || 'unknown error'));
    }
    return () => {
      if (leafletMapRef.current) { leafletMapRef.current.remove(); leafletMapRef.current = null; }
      polygonRef.current = null;
      markersRef.current = [];
    };
  }, []);

  // Redraw polygon + vertex markers when vertices change
  useEffect(() => {
    const map = leafletMapRef.current;
    if (!map || !window.L) return;
    if (polygonRef.current) { polygonRef.current.remove(); polygonRef.current = null; }
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    if (vertices.length >= 2) {
      polygonRef.current = window.L.polygon(vertices, {
        color: '#4A6B5C', fillColor: '#4A6B5C', fillOpacity: 0.15, weight: 2, dashArray: '5 5',
      }).addTo(map);
    }
    vertices.forEach(([lat, lng], i) => {
      const m = window.L.circleMarker([lat, lng], {
        radius: 5, color: 'white', fillColor: '#4A6B5C', fillOpacity: 1, weight: 2,
      }).bindTooltip(`#${i + 1}`, { permanent: false }).addTo(map);
      markersRef.current.push(m);
    });
  }, [vertices]);

  // Draw all saved zones as persistent overlays (skip selected — shown by vertex effect above)
  useEffect(() => {
    const map = leafletMapRef.current;
    if (!map || !window.L) return;
    savedLayersRef.current.forEach(l => l.remove());
    savedLayersRef.current = [];
    zones.forEach(zone => {
      if (!zone.polygon_coords || zone.polygon_coords.length < 3) return;
      if (selectedZone?.id === zone.id) return;
      const layer = window.L.polygon(zone.polygon_coords, {
        color: '#4A6B5C', fillColor: '#4A6B5C', fillOpacity: 0.10, weight: 1.5, dashArray: '4 4',
      });
      layer.bindTooltip(zone.name || 'Campus Zone', { permanent: false });
      layer.on('click', () => selectZone(zone));
      layer.addTo(map);
      savedLayersRef.current.push(layer);
    });
  }, [zones, selectedZone?.id]);

  const selectZone = (zone) => {
    setSelectedZone(zone);
    setZoneName(zone.name || '');
    setZoneDesc(zone.description_public || '');
    if (zone.polygon_coords && zone.polygon_coords.length >= 3) {
      setVertices(zone.polygon_coords);
      if (leafletMapRef.current && window.L) {
        try { leafletMapRef.current.fitBounds(zone.polygon_coords); } catch (_) {}
      }
    }
    setDrawMode(false);
  };

  const startNew = () => {
    setSelectedZone(null);
    setZoneName('');
    setZoneDesc('');
    setVertices([]);
    setDrawMode(false);
  };

  const centroid = (coords) => {
    const n = coords.length;
    return [coords.reduce((s, c) => s + c[0], 0) / n, coords.reduce((s, c) => s + c[1], 0) / n];
  };

  const handleSave = async () => {
    if (vertices.length < 3 || !zoneName.trim()) return;
    setSaving(true);
    try {
      if (selectedZone) {
        await AnchorAPI.apiPatch(`/v1/admin/campus-zones/${selectedZone.id}`, {
          name: zoneName.trim(),
          description: zoneDesc.trim() || null,
          polygon_coords: vertices,
        });
      } else {
        const [c_lat, c_lng] = centroid(vertices);
        await AnchorAPI.apiPostAuth('/v1/admin/campus-zones', {
          name: zoneName.trim(),
          zone_type: 'campus',
          shape_type: 'polygon',
          polygon_coords: vertices,
          center_lat: c_lat,
          center_lng: c_lng,
          description: zoneDesc.trim() || null,
        });
      }
      setSaved(true);
      setTimeout(() => setSaved(false), 3000);
      loadZones();
    } catch (e) {
      console.error('[Geofence] Save failed:', e);
      alert('Save failed: ' + (e.message || 'Unknown error'));
    } finally {
      setSaving(false);
    }
  };

  const handleArchive = async (zone, e) => {
    e.stopPropagation();
    if (!confirm(`Archive zone "${zone.name}"? It will be removed from the student map.`)) return;
    try {
      await AnchorAPI.apiDelete(`/v1/admin/campus-zones/${zone.id}`);
      if (selectedZone?.id === zone.id) startNew();
      loadZones();
    } catch (err) {
      console.error('[Geofence] Archive failed:', err);
    }
  };

  return (
    <>
      <PageHeader
        title="Campus geofence"
        bn="ক্যাম্পাস সীমানা"
        description="Draw your university's safety boundary. Saved zones appear on the student map immediately."
        actions={
          <>
            <GhostButton icon="plus" size="sm" onClick={startNew}>New zone</GhostButton>
            <GhostButton icon={drawMode ? 'pencil-off' : 'pencil'} size="sm" onClick={() => setDrawMode(m => !m)}>
              {drawMode ? 'Done drawing' : 'Draw boundary'}
            </GhostButton>
            {vertices.length > 0 && (
              <GhostButton icon="undo-2" size="sm" onClick={() => setVertices(v => v.slice(0, -1))}>Undo</GhostButton>
            )}
            <GhostButton icon="trash-2" size="sm" onClick={() => setVertices([])}>Clear</GhostButton>
            <PrimaryButton
              icon="save"
              mode="sage"
              size="sm"
              onClick={handleSave}
              disabled={saving || vertices.length < 3 || !zoneName.trim()}
            >
              {saving ? 'Saving…' : saved ? 'Saved ✓' : selectedZone ? 'Update zone' : 'Save zone'}
            </PrimaryButton>
          </>
        }
      />

      <AuditNote tone="navy" icon="shield-check">
        Campus zones appear on the student safety map as green highlighted areas. Active alerts inside a zone are routed to platform operators in real time.
      </AuditNote>

      <div className="flex gap-4 mt-5" style={{ height: 'calc(100vh - 220px)', minHeight: 420 }}>
        {/* Leaflet map */}
        <div className="flex-1 rounded-sm border hair relative" style={{ minWidth: 0 }}>
          {drawMode && (
            <div
              className="absolute top-3 z-[1000] px-3 py-1.5 rounded text-[12px] font-medium flex items-center gap-2"
              style={{ left: '50%', transform: 'translateX(-50%)', background: 'var(--sage)', color: 'white', boxShadow: 'var(--shadow)', pointerEvents: 'all' }}
            >
              <Icon name="map-pin" size={13} />
              Click map to place boundary vertices
              <button onClick={() => setDrawMode(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0, opacity: 0.8, display: 'flex' }}>
                <Icon name="x" size={12} />
              </button>
            </div>
          )}
          {mapError ? (
            <div className="w-full h-full flex flex-col items-center justify-center p-6 text-center" style={{ background: 'var(--mist)' }}>
              <Icon name="map-off" size={32} className="mb-3 text-[var(--muted)]" />
              <p className="text-[13px] text-[var(--graphite)]">{mapError}</p>
            </div>
          ) : (
            <div ref={mapDivRef} className="w-full h-full" style={{ cursor: drawMode ? 'crosshair' : undefined }} />
          )}
        </div>

        {/* Right panel */}
        <div className="flex flex-col gap-4 overflow-y-auto" style={{ width: 280, flexShrink: 0 }}>
          <Card>
            <SectionLabel>{selectedZone ? 'Edit zone' : 'New zone'}</SectionLabel>
            <div className="space-y-3">
              <div>

                  margin: '0 -12px', padding: '8px 12px', borderBottom: '1px solid var(--mist)',
                  cursor: 'pointer', borderRadius: 4,
                  background: selectedZone?.id === z.id ? 'rgba(74,107,92,0.08)' : 'transparent',

              >
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#4A6B5C', flexShrink: 0 }} />
                    <span style={{ fontSize: 12.5, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{z.name}</span>
                  </div>

                    <p style={{ fontSize: 11, color: 'var(--muted)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', margin: '2px 0 0 14px' }}>{z.description_public}</p>
                  )}
                  <p style={{ fontSize: 11, color: 'var(--muted)', margin: '1px 0 0 14px' }}>
                    {(z.polygon_coords?.length ?? 0)} vertices
                  </p>
                </div>
                <button
                  onClick={(ev) => handleArchive(z, ev)}
                  title="Archive zone"
                  style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 2, opacity: 0.4, display: 'flex', flexShrink: 0, marginLeft: 8 }}
                  onMouseEnter={e => e.currentTarget.style.opacity = 1}
                  onMouseLeave={e => e.currentTarget.style.opacity = 0.4}
                >
                  <Icon name="archive" size={13} />
                </button>
              </div>
            ))}
          </Card>

          <Card>
            <SectionLabel>Recent alerts inside zone</SectionLabel>
            {recentAlerts.length === 0 ? (
              <div style={{ fontSize: 12, color: 'var(--muted)', textAlign: 'center', padding: '8px 0' }}>No active alerts</div>
            ) : recentAlerts.map(ev => (
              <div key={ev.event_id} className="flex justify-between items-center text-[12.5px] py-1.5 hair-b last:border-0">
                <span className="font-mono text-[var(--muted)]">{ev.event_id.slice(0, 8)}…</span>
                <span style={{ color: ev.state === 'active' ? 'var(--ember)' : 'var(--sage)' }}>{ev.state}</span>
              </div>
            ))}
          </Card>
        </div>
      </div>
    </>
  );
}

// ---- Classroom reports ----
function UniClassrooms({ onGo }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');

  useEffect(() => {
    AnchorAPI.apiGet('/v1/classroom-reports')
      .then(data => {
        const map = {};
        (Array.isArray(data) ? data : []).forEach(r => {
          if (!map[r.classroom_ref]) map[r.classroom_ref] = { room: r.classroom_ref, issues: [], count: 0 };
          map[r.classroom_ref].issues.push(r.issue_type);
          map[r.classroom_ref].count += r.count;
        });
        setRows(Object.values(map).sort((a, b) => b.count - a.count));
        setLoading(false);
      })
      .catch(err => { setError(err.message || 'Could not load classroom reports.'); setLoading(false); });
  }, []);

  return (
    <>
      <PageHeader
        title="Classroom reports"
        description="Sorted by most-reported classroom. Bulk-resolve and schedule maintenance from this view."
        actions={
          <>
            <GhostButton icon="wrench" size="sm">Schedule maintenance</GhostButton>
            <GhostButton icon="check-square" size="sm">Bulk resolve</GhostButton>
          </>
        }
      />

      {error && (
        <div className="mb-4 px-3 py-2 rounded-sm text-[12.5px]" style={{ background:'rgba(232,49,42,0.08)', color:'var(--red)', border:'1px solid rgba(232,49,42,0.2)' }}>
          {error}
        </div>
      )}

      {loading && (
        <Card>
          <div className="space-y-3 animate-pulse">
            {[1,2,3].map(i => <div key={i} className="h-4 bg-[var(--mist)] rounded-sm" />)}
          </div>
        </Card>
      )}

      {!loading && rows.length === 0 && !error && (
        <Card><EmptyState icon="clipboard" title="No classroom reports" body="No students have submitted classroom condition reports yet." /></Card>
      )}

      {!loading && rows.length > 0 && (
        <Card noPad>
          <DataTable
            columns={[
              { key:'room', label:'Room', render:r=><MonoChip tone="navy">{r.room}</MonoChip> },
              { key:'count', label:'Reports', align:'right', render:r=><span className="font-mono text-[var(--ink)]">{r.count}</span> },
              { key:'issues', label:'Issues reported', render:r=><div className="flex flex-wrap gap-1">{r.issues.map(i=><Tag key={i} tone="mist">{i}</Tag>)}</div> },
            ]}
            rows={rows}
            onRowClick={()=>{}}
          />
        </Card>
      )}
    </>
  );
}

  return (
    <div className={`hair border rounded-sm p-4 space-y-3 ${isDone ? 'opacity-60' : ''}`}
