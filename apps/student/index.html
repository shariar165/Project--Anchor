<!DOCTYPE html>
<html lang="en">
<head>

<title>Anchor AI — Civic Trust Platform</title>

<!-- PWA install + iOS web push. iOS delivers web push ONLY to a site added to the
     Home Screen (standalone). These tags make the app installable so iPhone users
     can receive emergency alerts after "Add to Home Screen". -->
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#0B1D35"/>

<!-- Theme pre-paint: set data-theme on <html> before CSS/React load so a
     dark-preference device never flashes the light theme. Stored choice wins;
     otherwise follow the OS setting. AppProvider keeps this in sync afterward. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('anchor_theme');
      var theme = (saved === 'light' || saved === 'dark')
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#0E1620');
      }
    } catch (e) { /* storage/matchMedia unavailable — default light */ }
  })();
</script>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Anchor"/>
<link rel="apple-touch-icon" href="/icons/icon.svg"/>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg"/>

<!-- Fonts: Fraunces (editorial serif), Inter Tight (sans), Hind Siliguri (Bangla), JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter+Tight:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="src/styles.css"/>

<!-- Boot placeholder — shown until React mounts (Babel compiles src/*.jsx
     at runtime). React's createRoot().render() clears #root, removing it. -->
<style>
  #boot-splash {
    position: fixed; inset: 0; z-index: 0; background: #0E0E0F;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #boot-splash .boot-mark {
    width: 64px; height: 64px; border-radius: 16px; margin-bottom: 22px;
    background: rgba(247,243,238,0.05); border: 1px solid rgba(247,243,238,0.12);
    display: flex; align-items: center; justify-content: center; color: #F7F3EE;
  }
  #boot-splash .boot-word {
    font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 64px;
    letter-spacing: -0.035em; line-height: 1; color: #F7F3EE;
  }
  #boot-splash .boot-word span { color: #C44536; font-style: italic; }
  #boot-splash .boot-dot {
    position: absolute; bottom: 40px; width: 5px; height: 5px; border-radius: 999px;
    background: rgba(247,243,238,0.4); animation: bootPulse 1.4s ease-in-out infinite;
  }
  @keyframes bootPulse {
    0%, 100% { opacity: .25; transform: scale(.8); }
    50%      { opacity: 1;   transform: scale(1.3); }
  }
</style>

<!-- Leaflet map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head>

    <div class="boot-word">Anchor<span>.</span></div>
    <div class="boot-dot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<!-- API base URL — auto-detects localhost vs production -->
<script src="config.js"></script>

<!-- i18n dictionary + resolver (plain JS — must run before the Babel scripts
     below so window.tStr exists by first render). -->
<script src="src/strings.jsx"></script>
<!-- Safety guard: if strings.jsx fails to load, tStr/contentLang still work. -->
<script>
  if (!window.tStr) window.tStr = function (k) { return k; };
  if (!window.contentLang) window.contentLang = function (l) {
    var u = String(l || '').toUpperCase(); return (u === 'BN' || u === 'BI') ? 'BN' : 'EN';
  };
</script>

<!-- Firebase Web SDK (compat/UMD) for push notifications -->

<script type="text/babel">

  root.render(<App/>);
</script>
